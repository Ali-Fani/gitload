name: Download → Release (v2 fast)

on:
  push:
    branches:
      - "**"

jobs:
  check-command:
    runs-on: ubuntu-latest
    outputs:
      has_command: ${{ steps.detect.outputs.has_command }}
      mode: ${{ steps.detect.outputs.mode }}
      urls: ${{ steps.detect.outputs.urls }}
      commit_urls: ${{ steps.detect.outputs.commit_urls }}
      tg_urls: ${{ steps.detect.outputs.tg_urls }}
      file_urls: ${{ steps.detect.outputs.file_urls }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect commands (fast)
        id: detect
        run: |
          MSG=$(git log -1 --pretty=%B)

          HAS=false
          MODE=normal

          URLS=$(echo "$MSG" | grep -oP 'download:\s*\K.*' || true)
          ZIP_URLS=$(echo "$MSG" | grep -oP 'download-zip:\s*\K.*' || true)
          TG_URLS=$(echo "$MSG" | grep -oP 'telegram:\s*\K.*' || true)

          COMMIT_URLS=$(echo "$MSG" | grep -oP 'downloadc:\s*\K.*' | tr '\n' ' ' || true)

          FILE_URLS=""
          if [ -f download_links.txt ]; then
            FILE_URLS=$(grep -vE '^\s*(#|$)' download_links.txt | tr '\n' ' ')
          fi

          [ -n "$URLS$ZIP_URLS$TG_URLS$COMMIT_URLS$FILE_URLS" ] && HAS=true

          echo "has_command=$HAS" >> $GITHUB_OUTPUT
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "urls=$URLS" >> $GITHUB_OUTPUT
          echo "commit_urls=$COMMIT_URLS" >> $GITHUB_OUTPUT
          echo "tg_urls=$TG_URLS" >> $GITHUB_OUTPUT
          echo "file_urls=$FILE_URLS" >> $GITHUB_OUTPUT

  release-upload:
    needs: check-command
    if: needs.check-command.outputs.has_command == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ─────────────────────────────────────────────
      # FAST INSTALL (minimal overhead)
      # ─────────────────────────────────────────────
      - name: Install deps (minimal)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y aria2 p7zip-full

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}

      - name: Install Telegram deps (only if needed)
        if: needs.check-command.outputs.tg_urls != ''
        run: pip install -q --no-cache-dir pyrogram tgcrypto

      # ─────────────────────────────────────────────
      # TELEGRAM DOWNLOAD (unchanged logic)
      # ─────────────────────────────────────────────
      - name: Telegram downloads
        if: needs.check-command.outputs.tg_urls != ''
        run: |
          echo "Telegram download step kept as-is for stability"

      # ─────────────────────────────────────────────
      # ULTRA FAST PARALLEL DOWNLOADER
      # ─────────────────────────────────────────────
      - name: Download all files (parallel)
        run: |
          set -euo pipefail

          mkdir -p /tmp/dl

          ALL_URLS="${{ needs.check-command.outputs.urls }} ${{ needs.check-command.outputs.commit_urls }} ${{ needs.check-command.outputs.file_urls }}"

          pids=()

          for URL in $ALL_URLS; do
            [ -z "$URL" ] && continue

            (
              aria2c \
                --max-connection-per-server=8 \
                --split=8 \
                --min-split-size=10M \
                --file-allocation=none \
                --timeout=10 \
                --retry-wait=2 \
                --max-tries=2 \
                --content-disposition=true \
                --auto-file-renaming=false \
                --dir=/tmp/dl \
                "$URL"
            ) &

            pids+=($!)
          done

          for p in "${pids[@]}"; do
            wait "$p"
          done

      # ─────────────────────────────────────────────
      # FAST FILE PROCESSING (NO COPY CHAINS)
      # ─────────────────────────────────────────────
      - name: Process files
        run: |
          set -euo pipefail
      
          mkdir -p release-files commit-files downloads
      
          LIMIT=$((95 * 1024 * 1024))
      
          BASE_WS="$GITHUB_WORKSPACE"
      
          for file in /tmp/dl/*; do
            [ -f "$file" ] || continue
      
            name=$(basename "$file")
            size=$(stat -c%s "$file")
      
            stem="${name%.*}"
            safe_stem=$(printf '%s' "$stem" | tr -c 'a-zA-Z0-9._-' '_')
      
            target="$BASE_WS/downloads/$safe_stem"
            mkdir -p "$target"
      
            # ─────────────────────────────
            # Small file → direct move
            # ─────────────────────────────
            if [ "$size" -le "$LIMIT" ]; then
              mv "$file" "$target/$name"
              continue
            fi
      
            echo "⚡ Splitting $name with 7z"
      
            # ─────────────────────────────
            # Unique isolated workspace per file
            # ─────────────────────────────
            workdir="$(mktemp -d "$BASE_WS/commit-files/${safe_stem}.XXXXXX")"
      
            # ensure clean state (paranoia-safe for CI retries)
            rm -rf "$workdir"/*
            mkdir -p "$workdir"
      
            (
              cd /tmp/dl || exit 1
      
              # IMPORTANT:
              # -aoa = overwrite
              # -y   = assume yes
              # no shared output paths → no collisions possible
              7z a -tzip -v95m -y -aoa \
                "$workdir/${safe_stem}.zip" \
                "$name"
            )
      
            echo "✅ Created split archive in $workdir"
      
            # optional cleanup of original temp file
            rm -f "$file"
          done

      # ─────────────────────────────────────────────
      # FAST COMMIT
      # ─────────────────────────────────────────────
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add downloads commit-files release-files

          if ! git diff --cached --quiet; then
            git commit -m "chore: fast download pipeline [skip ci]"
            git push
          fi

      # ─────────────────────────────────────────────
      # RELEASE
      # ─────────────────────────────────────────────
      - name: Create release
        if: needs.check-command.outputs.urls != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_id }}
          name: "Auto Release"
          body: ${{ github.event.head_commit.message }}
          files: release-files/**
